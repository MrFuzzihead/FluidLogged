name: Game and coverage tests

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-coverage:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and coverage
        run: ./gradlew test jacocoTestReport --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit
          path: build/reports/jacoco/test/html
          if-no-files-found: warn

  game-test:
    name: In-game assertions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept the Minecraft EULA
        run: mkdir -p run/server && echo "eula=true" > run/server/eula.txt

      - name: Run the game tests
        run: ./gradlew gameTestServer --stacktrace

      - name: Check the marker
        # The test mod prints the OK marker only after every assertion passed and the server is
        # shutting down cleanly. FML also writes fml-junk-earlystartup.log, hence the wildcard.
        run: |
          ls -l run/server/logs/ || true
          test -n "$(ls run/server/logs/*.log 2>/dev/null)" || { echo "no server log was written"; exit 1; }
          grep -hE "FLUIDLOGGED-GAMETEST\] [0-9]+/[0-9]+ checks passed" run/server/logs/*.log || true
          grep -hq "FLUIDLOGGED_GAMETEST_OK" run/server/logs/*.log
          ! grep -hq "FLUIDLOGGED_GAMETEST_FAILED" run/server/logs/*.log

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-test-log
          path: run/server/logs/
          if-no-files-found: warn
